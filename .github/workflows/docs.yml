name: Documentation

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  generate-docs:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    container:
      image: gitlab.desy.de:5555/constellation/build-images/fedora-sphinx
    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Ignore git ownership warnings
        run: git config --global --add safe.directory $GITHUB_WORKSPACE

      - name: Set up Python Venv
        run: |
          python3 -m venv .venv
          echo "${GITHUB_WORKSPACE}/.venv/bin" >> "$GITHUB_PATH"

      - name: Install build tooling
        run: pip install --upgrade pip setuptools meson-python meson ninja

      - name: Install Constellation
        run: pip install --no-build-isolation -e .[docs]

      - name: Generate Doxygen
        run: |
          make -C docs doxygen

      - name: Build documentation
        run: |
          make -C docs html

      - name: Check Spelling
        run: |
          make -C docs spelling

      - name: Upload docs artifact
        uses: actions/upload-artifact@v7
        with:
          name: docs-html
          path: docs/build/html/
